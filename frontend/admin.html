<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCloud — Usuarios y cuotas</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <div class="app-shell">

        <header class="topbar" id="topbar"></header>

        <div class="app-body">
            <div class="cab-backdrop" id="backdrop"></div>

            <!-- SIDEBAR -->
            <aside class="sidebar" id="cabinet" aria-label="Menú lateral">
                <nav class="cab-nav" aria-label="Secciones de administración" id="cabNav"></nav>
            </aside>

            <!-- CONTENIDO -->
            <main class="main">
                <div class="content" id="content" tabindex="-1"></div>
            </main>
        </div>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/http.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/drive.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Solo entran usuarios con rol "admin". Es una comodidad de UI: la API
        // (api.js) vuelve a validar el rol en cada operación, y con backend real
        // /admin tiene que estar protegida también en el servidor.
        const admin = Auth.requerirSesion('admin');
        if (!admin) {
            throw new Error('Sin permisos de administrador: redirigiendo');
        }

        // Solo prototipo: simula que las cuentas aprobadas ya tenían archivos, así
        // los números de almacenamiento no quedan en cero hasta que cada una entre.
        Auth.listarUsuarios().filter(u => u.estado === 'aprobado').forEach(u => Drive.asegurar(u));

        const $ = (sel, raiz = document) => raiz.querySelector(sel);
        const { esc, iconos, formatoTamanio, formatoFecha } = UI;
        const tam = (mb) => formatoTamanio(mb, { cero: '0 MB' });

        $('#topbar').innerHTML = UI.topbarHtml(admin);
        const content = $('#content');
        const searchInput = $('#searchInput');
        const cerrarSidebar = UI.enlazarSidebar();
        UI.atajoBuscar(searchInput);

        const estado = {
            seccion: 'usuarios',
            busqueda: '',
            filtroEstado: 'todos',
            tablas: {
                usuarios: { clave: 'nombre', dir: 'asc', pagina: 1 },
            },
        };

        const SECCIONES = [
            { id: 'usuarios', titulo: 'Gestión de usuarios y cuotas', icono: iconos.usuarios },
            { id: 'politicas', titulo: 'Políticas por rol', icono: iconos.politicas },
        ];

        // ---------------------------------------------------------------
        // Navegación y barra superior
        // ---------------------------------------------------------------
        function pintarNav() {
            $('#cabNav').innerHTML = `
      <p class="nav-label">Espacio personal</p>
      <a class="nav-link" href="index.html#archivos">${iconos.carpeta}Mis archivos</a>
      <a class="nav-link" href="index.html#compartidos">${iconos.compartir}Compartidos conmigo</a>
      <a class="nav-link" href="index.html#papelera">${iconos.papelera}Papelera</a>
      <p class="nav-label">Administración</p>
      ${SECCIONES.map(s => `
        <button type="button" class="nav-link${s.id === estado.seccion ? ' active' : ''}" data-section="${s.id}"${s.id === estado.seccion ? ' aria-current="page"' : ''}>${s.icono}${esc(s.titulo)}</button>`).join('')}`;
        }

        $('#cabNav').addEventListener('click', (e) => {
            const b = e.target.closest('[data-section]');
            if (!b) return;
            estado.seccion = b.dataset.section;
            estado.busqueda = '';
            cerrarSidebar();
            render();
        });

        $('#btnCuenta').addEventListener('click', () => Auth.irA('index.html#cuenta'));

        $('#btnSalir').addEventListener('click', async () => {
            const okConfirm = await UI.confirmar({ titulo: '¿Cerrar sesión?', textoOk: 'Cerrar sesión' });
            if (okConfirm) { Auth.cerrarSesion(); Auth.irA('login.html'); }
        });

        // La búsqueda de la barra superior es de archivos: al apretar Enter se sigue en el Drive.
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim()) {
                Auth.irA('index.html?q=' + encodeURIComponent(searchInput.value.trim()));
            }
        });

        // ---------------------------------------------------------------
        // Helpers
        // ---------------------------------------------------------------
        const coincide = (u, q) => !q || [u.nombre, u.email, u.dni, Auth.formatearDNI(u.dni)].some(x => UI.normalizar(x).includes(q));

        const rolesOpciones = () => Auth.ROLES_SOLICITABLES.map(valor => ({ valor, texto: Auth.ROLES[valor] }));

        const avatar = (u) => `<span class="avatar-sm av-${UI.colorAvatar(u.id)}" aria-hidden="true">${esc(UI.iniciales(u.nombre))}</span>`;

        function estadoBadge(u) {
            if (u.estado === 'aprobado') return '';
            if (u.estado === 'pendiente') return UI.badge('Pendiente', 'warn');
            return UI.badge('Rechazada', 'danger', u.motivoRechazo);
        }

        function resultado(r, mensajeOk) {
            if (!r.ok) {
                if (r.status === 401) { Auth.irA('login.html?e=expirada'); return false; }
                UI.toast(r.motivo, { tipo: 'error' });
                return false;
            }
            if (mensajeOk) UI.toast(mensajeOk, { tipo: 'ok' });
            render();
            return true;
        }

        function estadisticas() {
            const usuarios = Auth.listarUsuarios();
            const hace30 = Date.now() - 30 * 86400000;
            return {
                total: usuarios.length,
                nuevos: usuarios.filter(u => Date.parse(u.creado) >= hace30).length,
                pendientes: usuarios.filter(u => u.estado === 'pendiente').length,
                usoMB: usuarios.reduce((a, u) => a + Drive.usoMB(u.id), 0),
            };
        }

        // ---------------------------------------------------------------
        // Vista: usuarios y cuotas
        // ---------------------------------------------------------------
        function htmlEstadisticas(s) {
            const cap = Auth.CAPACIDAD_SERVIDOR_MB;
            const pct = Math.min(100, (s.usoMB / cap) * 100);
            return `
      <div class="stat-grid">
        <div class="stat-card">
          <span class="stat-icon">${iconos.usuarios}</span>
          <div>
            <p class="stat-label">Usuarios totales</p>
            <p class="stat-value">${s.total}</p>
            <p class="stat-note is-ok">+${s.nuevos} este mes</p>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon stat-icon-indigo">${iconos.disco}</span>
          <div class="stat-grow">
            <p class="stat-label">Almacenamiento del servidor</p>
            <p class="stat-value">${esc(tam(s.usoMB))} <span class="stat-unit">/ ${esc(formatoTamanio(cap))}</span></p>
            <div class="dc-meter dc-meter-thin" role="progressbar" aria-label="Almacenamiento del servidor usado" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div class="dc-meter-fill dc-meter-indigo" style="width:${pct.toFixed(1)}%"></div></div>
          </div>
        </div>
        <div class="stat-card">
          <span class="stat-icon stat-icon-amber">${iconos.reloj}</span>
          <div>
            <p class="stat-label">Solicitudes pendientes</p>
            <p class="stat-value">${s.pendientes}</p>
            <p class="stat-note ${s.pendientes ? 'is-warn' : ''}">${s.pendientes ? 'Requieren revisión' : 'Todo al día'}</p>
          </div>
        </div>
      </div>`;
        }

        function htmlPendientes() {
            const pendientes = Auth.obtenerPendientes().sort((a, b) => Date.parse(a.creado) - Date.parse(b.creado));
            return `
      <section aria-labelledby="tPend">
        <div class="section-head">
          <div>
            <h2 id="tPend">Solicitudes pendientes ${pendientes.length ? `<span class="count-pill">${pendientes.length}</span>` : ''}</h2>
            <p class="dc-muted">Revisá los nuevos registros antes de habilitar el acceso.</p>
          </div>
        </div>
        ${pendientes.length ? `<div class="req-list">${pendientes.map(u => `
          <article class="req-row">
            <div class="req-user">
              ${avatar(u)}
              <div class="cell-stack"><strong>${esc(u.nombre)}</strong><span>${esc(u.email)}</span></div>
            </div>
            <div class="req-field"><span class="req-label">DNI</span><span>${esc(Auth.formatearDNI(u.dni) || '—')}</span></div>
            <div class="req-field"><span class="req-label">Rol solicitado</span>${UI.badgeRol(u.rolSolicitado)}</div>
            <div class="req-actions">
              <button type="button" class="dc-btn dc-btn-soft dc-btn-sm" data-aprobar="${esc(u.id)}" data-rol="alumno">${iconos.check}Aprobar como Alumno</button>
              <button type="button" class="dc-btn dc-btn-violet dc-btn-sm" data-aprobar="${esc(u.id)}" data-rol="docente">Aprobar como Docente</button>
              <button type="button" class="dc-btn dc-btn-outline-danger dc-btn-sm" data-rechazar="${esc(u.id)}">Rechazar</button>
            </div>
          </article>`).join('')}</div>`
                    : `<div class="empty-state" role="status">${iconos.check}<p>No hay cuentas esperando aprobación.</p></div>`}
      </section>`;
        }

        function tablaUsuarios() {
            const q = UI.normalizar(estado.busqueda);
            const filas = Auth.listarUsuarios().filter(u => coincide(u, q) && (estado.filtroEstado === 'todos' || u.estado === estado.filtroEstado));
            const columnas = [
                {
                    clave: 'nombre', titulo: 'Usuario', ordenable: true, valor: u => u.nombre,
                    render: u => `<div class="req-user">${avatar(u)}<div class="cell-stack"><strong>${esc(u.nombre)}</strong><span>${esc(u.email)}</span></div></div>`,
                },
                { clave: 'dni', titulo: 'DNI', ordenable: true, valor: u => u.dni, render: u => esc(Auth.formatearDNI(u.dni) || '—') },
                {
                    clave: 'rol', titulo: 'Rol actual', ordenable: true, valor: u => u.rol,
                    render: u => `<span class="badge-stack">${UI.badgeRol(u.rol)}${estadoBadge(u)}</span>`,
                },
                {
                    clave: 'uso', titulo: 'Espacio ocupado', ordenable: true, valor: u => Drive.usoMB(u.id),
                    render: u => {
                        const pol = Auth.politicaEfectiva(u);
                        const uso = Drive.usoMB(u.id);
                        const pct = Math.min(100, (uso / pol.cuotaMB) * 100);
                        const nivel = pct >= 90 ? 'alert' : pct >= 70 ? 'warn' : 'ok';
                        return `<div class="usage"><span>${esc(tam(uso))}</span>
            <div class="dc-meter dc-meter-mini" role="progressbar" aria-label="Espacio usado de ${esc(u.nombre)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><div class="dc-meter-fill dc-meter-${nivel}" style="width:${pct.toFixed(1)}%"></div></div></div>`;
                    },
                },
                {
                    clave: 'cuota', titulo: 'Cuota asignada', ordenable: true, valor: u => Auth.politicaEfectiva(u).cuotaMB,
                    render: u => {
                        const pol = Auth.politicaEfectiva(u);
                        return `${esc(formatoTamanio(pol.cuotaMB))}${pol.origen.cuotaMB === 'usuario' ? '<span class="dc-origin">Personalizada</span>' : ''}`;
                    },
                },
                {
                    clave: 'acciones', titulo: 'Acciones', clase: 'col-actions',
                    render: u => `<span class="row-actions">
          <button type="button" class="dc-link" data-editar-cuota="${esc(u.id)}">Editar cuota</button>
          <button type="button" class="dc-link" data-menu-usuario="${esc(u.id)}" aria-haspopup="menu" aria-expanded="false" aria-label="Gestionar la cuenta de ${esc(u.nombre)}">Gestionar</button>
        </span>`,
                },
            ];
            return UI.tabla({
                caption: 'Usuarios registrados',
                columnas, filas,
                estado: estado.tablas.usuarios,
                vacio: 'No hay cuentas que coincidan con la búsqueda o el filtro.',
            });
        }

        function vistaUsuarios() {
            const s = estadisticas();
            return `
      <div class="page-head">
        <div>
          <p class="eyebrow">Panel de administración</p>
          <h1 class="page-title">Usuarios y cuotas</h1>
          <p class="page-sub">Gestioná accesos, roles y límites de almacenamiento.</p>
        </div>
        <button type="button" class="dc-updated" id="btnActualizar">${iconos.reloj}Actualizado ahora</button>
      </div>
      ${htmlEstadisticas(s)}
      ${htmlPendientes()}
      <section aria-labelledby="tUsuarios">
        <div class="section-head">
          <div>
            <h2 id="tUsuarios">Gestión de usuarios</h2>
            <p class="dc-muted">${s.total} usuario${s.total === 1 ? '' : 's'} registrado${s.total === 1 ? '' : 's'}</p>
          </div>
          <div class="section-tools">
            <label class="dc-inline-field">
              <span class="visually-hidden">Filtrar por estado</span>
              <select id="filtroEstado">
                ${[['todos', 'Todos los estados'], ['aprobado', 'Aprobadas'], ['pendiente', 'Pendientes'], ['rechazado', 'Rechazadas']].map(([v, t]) => `<option value="${v}"${estado.filtroEstado === v ? ' selected' : ''}>${t}</option>`).join('')}
              </select>
            </label>
            <div class="search search-inline">
              ${iconos.lupa}
              <label for="buscarUsuario" class="visually-hidden">Buscar usuario por nombre, correo o DNI</label>
              <input type="search" id="buscarUsuario" placeholder="Buscar usuario…" autocomplete="off" value="${esc(estado.busqueda)}">
            </div>
          </div>
        </div>
        <div id="tablaUsuarios">${tablaUsuarios()}</div>
      </section>`;
        }

        // ---------------------------------------------------------------
        // Vista: políticas por rol
        // ---------------------------------------------------------------
        function filaPolitica(valores, campo, formato) {
            return valores[campo] != null ? formato(valores[campo]) : '<small>Hereda de la política general</small>';
        }

        function vistaPoliticas() {
            const pol = Auth.obtenerPoliticas();
            const usuarios = Auth.listarUsuarios();
            const tarjetas = [
                { scope: 'global', titulo: 'Política general', desc: 'Base de todas las cuentas. Cada rol y cada usuario puede pisarla.', valores: pol.global, cuenta: usuarios.length, etiquetaCuenta: 'cuentas en total' },
                ...Object.entries(Auth.ROLES).map(([k, nombre]) => ({
                    scope: k, titulo: `Rol ${nombre}`, desc: 'Se aplica a las cuentas con este rol.', valores: pol.roles[k],
                    cuenta: usuarios.filter(u => u.rol === k).length, etiquetaCuenta: 'cuentas con este rol',
                })),
            ];
            return `
      <div class="page-head">
        <div>
          <p class="eyebrow">Panel de administración</p>
          <h1 class="page-title">Políticas por rol</h1>
          <p class="page-sub">Definí espacio, tamaño máximo y extensiones para cada rol.</p>
        </div>
        <button type="button" class="dc-btn dc-btn-ghost" id="btnRestaurarPol">${iconos.restaurar}Restaurar valores originales</button>
      </div>
      <div class="dc-note">${iconos.info}<span>Los cambios aplican a las subidas nuevas. Los archivos que ya están guardados no se tocan. Las excepciones por usuario se cargan con “Editar cuota” o “Gestionar” en Usuarios y cuotas.</span></div>
      <div class="dc-cards">
        ${tarjetas.map(t => `
          <article class="dc-policy-card">
            <header><h3>${esc(t.titulo)}</h3>${UI.badge(`${t.cuenta} ${t.etiquetaCuenta}`, 'neutral')}</header>
            <p class="dc-muted">${esc(t.desc)}</p>
            <dl>
              <dt>Espacio total</dt><dd>${filaPolitica(t.valores, 'cuotaMB', v => esc(formatoTamanio(v)))}</dd>
              <dt>Tamaño máximo por archivo</dt><dd>${filaPolitica(t.valores, 'maxArchivoMB', v => esc(formatoTamanio(v)))}</dd>
              <dt>Extensiones</dt><dd>${filaPolitica(t.valores, 'extensiones', v => esc(Auth.describirExtensiones(v)))}</dd>
            </dl>
            <button type="button" class="dc-btn dc-btn-primary dc-btn-sm" data-editar-politica="${esc(t.scope)}">${iconos.editar}Editar</button>
          </article>`).join('')}
      </div>`;
        }

        function render() {
            pintarNav();
            const titulo = SECCIONES.find(s => s.id === estado.seccion).titulo;
            document.title = `CampusCloud — ${titulo}`;
            try {
                content.innerHTML = estado.seccion === 'politicas' ? vistaPoliticas() : vistaUsuarios();
            } catch (err) {
                // Si la sección falla al dibujarse, se muestra un aviso con "Reintentar" en vez de quedar en blanco.
                console.error(err);
                content.innerHTML = UI.errorVista('No pudimos mostrar esta sección. Probá de nuevo.');
            }
        }

        // ---------------------------------------------------------------
        // Acciones sobre cuentas
        // ---------------------------------------------------------------
        async function aprobarComo(id, rol, boton) {
            const u = Auth.obtenerUsuario(id);
            if (!u) return;
            const fila = boton.closest('.req-row');
            fila.querySelectorAll('button').forEach(b => { b.disabled = true; });
            const ok = resultado(await Api.cambiarEstadoUsuario(id, 'aprobado', { rol }), `Cuenta de ${u.nombre} aprobada como ${Auth.ROLES[rol]}.`);
            if (!ok) fila.querySelectorAll('button').forEach(b => { b.disabled = false; });
        }

        // Para reactivar una cuenta rechazada o suspendida (pide el rol final).
        async function aprobar(id) {
            const u = Auth.obtenerUsuario(id);
            if (!u) return;
            const v = await UI.formulario({
                titulo: `Aprobar a ${u.nombre}`,
                descripcion: 'Elegí el rol de la cuenta. Podés cambiarlo cuando quieras.',
                campos: [{ nombre: 'rol', etiqueta: 'Rol', tipo: 'select', opciones: rolesOpciones(), requerido: true }],
                valores: { rol: u.rolSolicitado },
                textoOk: 'Aprobar cuenta',
                alEnviar: async (d) => { const r = await Api.cambiarEstadoUsuario(id, 'aprobado', { rol: d.rol }); return r.ok ? null : r.motivo; },
            });
            if (v) { render(); UI.toast(`Cuenta de ${u.nombre} aprobada.`, { tipo: 'ok' }); }
        }

        async function rechazar(id, suspender = false) {
            const u = Auth.obtenerUsuario(id);
            if (!u) return;
            const v = await UI.formulario({
                titulo: `${suspender ? 'Suspender' : 'Rechazar'} a ${u.nombre}`,
                descripcion: 'La persona va a ver este motivo cuando intente iniciar sesión.',
                campos: [
                    { nombre: 'motivo', etiqueta: 'Motivo', tipo: 'select', requerido: true, opciones: Auth.MOTIVOS_RECHAZO.map(m => ({ valor: m.valor, texto: m.texto })) },
                    {
                        nombre: 'detalle', etiqueta: 'Detalle', tipo: 'textarea', placeholder: 'Agregá una aclaración para la persona',
                        requeridoSi: d => d.motivo === 'otro', msgRequerido: 'Explicá el motivo.',
                    },
                ],
                valores: { motivo: Auth.MOTIVOS_RECHAZO[0].valor },
                textoOk: suspender ? 'Suspender cuenta' : 'Rechazar cuenta',
                peligro: true,
                alEnviar: async (d) => {
                    const base = d.motivo === 'otro' ? '' : Auth.MOTIVOS_RECHAZO.find(m => m.valor === d.motivo).texto;
                    const texto = [base, d.detalle].filter(Boolean).join(' ');
                    const r = await Api.cambiarEstadoUsuario(id, 'rechazado', { motivo: texto });
                    return r.ok ? null : r.motivo;
                },
            });
            if (v) { render(); UI.toast(`Cuenta de ${u.nombre} ${suspender ? 'suspendida' : 'rechazada'}.`, { tipo: 'ok' }); }
        }

        async function cambiarRol(id) {
            const u = Auth.obtenerUsuario(id);
            if (!u) return;
            const v = await UI.formulario({
                titulo: `Cambiar rol de ${u.nombre}`,
                descripcion: 'El cambio se aplica la próxima vez que la persona cargue una página.',
                campos: [{ nombre: 'rol', etiqueta: 'Rol', tipo: 'select', opciones: rolesOpciones(), requerido: true }],
                valores: { rol: u.rol },
                textoOk: 'Guardar rol',
                alEnviar: async (d) => { const r = await Api.cambiarRol(id, d.rol); return r.ok ? null : r.motivo; },
            });
            if (v) { render(); UI.toast('Rol actualizado.', { tipo: 'ok' }); }
        }

        async function editarCuota(id) {
            const u = Auth.obtenerUsuario(id);
            if (!u) return;
            const { cuotaMB: _propia, ...sinCuota } = u.excepciones;
            const base = Auth.politicaEfectiva({ ...u, excepciones: sinCuota });
            const propia = u.excepciones.cuotaMB;
            const enGB = propia != null && propia >= 1024 && propia % 1024 === 0;
            const v = await UI.formulario({
                titulo: `Editar cuota de ${u.nombre}`,
                campos: [
                    { nombre: 'resumen', tipo: 'info', texto: `Usa ${tam(Drive.usoMB(u.id))}. Sin excepción, el rol ${Auth.ROLES[u.rol]} tiene ${tam(base.cuotaMB)}.` },
                    {
                        nombre: 'valor', etiqueta: 'Cuota asignada', tipo: 'number', placeholder: String(base.cuotaMB),
                        ayuda: 'Dejalo vacío para volver al valor que corresponde al rol.',
                        validar: (v, d) => (v * (d.unidad === 'GB' ? 1024 : 1) < 1 ? 'La cuota mínima es 1 MB.' : null),
                    },
                    { nombre: 'unidad', etiqueta: 'Unidad', tipo: 'select', opciones: [{ valor: 'MB', texto: 'MB' }, { valor: 'GB', texto: 'GB' }] },
                ],
                valores: { valor: propia != null ? (enGB ? propia / 1024 : propia) : '', unidad: enGB ? 'GB' : 'MB' },
                textoOk: 'Guardar cuota',
                alEnviar: async (d) => {
                    const mb = d.valor == null ? null : Math.max(1, Math.round(d.valor * (d.unidad === 'GB' ? 1024 : 1)));
                    const r = await Api.cambiarCuota(id, mb);
                    return r.ok ? null : r.motivo;
                },
            });
            if (v) { render(); UI.toast('Cuota actualizada.', { tipo: 'ok' }); }
        }

        // ---------------------------------------------------------------
        // Formulario de políticas (global, rol o excepción de usuario)
        // ---------------------------------------------------------------
        function camposPolitica(permiteHeredar) {
            const opcionesExt = [
                ...(permiteHeredar ? [{ valor: 'heredar', texto: 'Heredar' }] : []),
                { valor: 'todas', texto: 'Permitir todas' },
                { valor: 'permitidas', texto: 'Solo las de la lista' },
                { valor: 'bloqueadas', texto: 'Bloquear las de la lista' },
            ];
            const ayudaVacio = permiteHeredar ? 'Dejalo vacío para heredar.' : '';
            return [
                { nombre: 'cuotaMB', etiqueta: 'Espacio total (MB)', tipo: 'number', requerido: !permiteHeredar, min: 1, max: 100000000, ayuda: [ayudaVacio, '1 GB = 1024 MB.'].filter(Boolean).join(' ') },
                {
                    nombre: 'maxArchivoMB', etiqueta: 'Tamaño máximo por archivo (MB)', tipo: 'number', requerido: !permiteHeredar, min: 0.01, max: 1000000, ayuda: ayudaVacio,
                    validar: (v, d) => (d.cuotaMB != null && !Number.isNaN(d.cuotaMB) && v > d.cuotaMB) ? 'No puede superar el espacio total.' : null,
                },
                { nombre: 'extModo', etiqueta: 'Extensiones de archivo', tipo: 'select', opciones: opcionesExt },
                {
                    nombre: 'extLista', etiqueta: 'Lista de extensiones', tipo: 'text', placeholder: 'pdf, docx, png',
                    ayuda: 'Separadas por coma, sin punto.',
                    mostrarSi: d => d.extModo === 'permitidas' || d.extModo === 'bloqueadas',
                    requeridoSi: d => d.extModo === 'permitidas', msgRequerido: 'Indicá al menos una extensión permitida.',
                    validar: v => Auth.parsearExtensiones(v).invalidas.length ? 'Usá solo letras y números, separados por coma.' : null,
                },
            ];
        }

        function valoresPolitica(p, permiteHeredar) {
            const ext = p.extensiones;
            return {
                cuotaMB: p.cuotaMB != null ? p.cuotaMB : null,
                maxArchivoMB: p.maxArchivoMB != null ? p.maxArchivoMB : null,
                extModo: ext ? ext.modo : (permiteHeredar ? 'heredar' : 'todas'),
                extLista: ext ? ext.lista.join(', ') : '',
            };
        }

        function politicaDesdeFormulario(d) {
            const p = {};
            if (d.cuotaMB != null) p.cuotaMB = Math.round(d.cuotaMB);
            if (d.maxArchivoMB != null) p.maxArchivoMB = d.maxArchivoMB;
            if (d.extModo && d.extModo !== 'heredar') {
                p.extensiones = { modo: d.extModo, lista: d.extModo === 'todas' ? [] : Auth.parsearExtensiones(d.extLista).lista };
            }
            return p;
        }

        async function editarPolitica(scope) {
            const pol = Auth.obtenerPoliticas();
            const esGlobal = scope === 'global';
            const actual = esGlobal ? pol.global : pol.roles[scope];
            const v = await UI.formulario({
                titulo: esGlobal ? 'Editar política general' : `Editar rol ${Auth.ROLES[scope]}`,
                descripcion: esGlobal ? 'Estos valores aplican a todas las cuentas salvo que un rol o una excepción los pise.' : 'Los campos vacíos heredan el valor de la política general.',
                campos: camposPolitica(!esGlobal),
                valores: valoresPolitica(actual, !esGlobal),
                textoOk: 'Guardar política',
                alEnviar: async (d) => {
                    const nueva = politicaDesdeFormulario(d);
                    const r = await (esGlobal ? Api.guardarPoliticaGlobal(nueva) : Api.guardarPoliticaRol(scope, nueva));
                    return r.ok ? null : r.motivo;
                },
            });
            if (v) { render(); UI.toast('Política guardada.', { tipo: 'ok' }); }
        }

        async function editarExcepciones(id) {
            const u = Auth.obtenerUsuario(id);
            if (!u) return;
            const base = Auth.politicaEfectiva({ ...u, excepciones: {} });
            const resumen = `Sin excepciones, esta cuenta (rol ${Auth.ROLES[u.rol]}) tiene ${formatoTamanio(base.cuotaMB)} de espacio, ${formatoTamanio(base.maxArchivoMB)} por archivo y “${Auth.describirExtensiones(base.extensiones)}”.`;
            const v = await UI.formulario({
                titulo: `Excepciones de ${u.nombre}`,
                campos: [{ nombre: 'resumen', tipo: 'info', texto: resumen }, ...camposPolitica(true)],
                valores: valoresPolitica(u.excepciones, true),
                textoOk: 'Guardar excepciones',
                alEnviar: async (d) => {
                    const r = await Api.guardarExcepciones(id, politicaDesdeFormulario(d));
                    return r.ok ? null : r.motivo;
                },
            });
            if (v) { render(); UI.toast('Excepciones guardadas.', { tipo: 'ok' }); }
        }

        // ---------------------------------------------------------------
        // Eventos
        // ---------------------------------------------------------------
        UI.enlazarTabla(content, () => (estado.seccion === 'usuarios' ? estado.tablas.usuarios : null), render);

        // El buscador y el filtro de la tabla solo redibujan la tabla, así el cursor no se pierde.
        function refrescarTabla() {
            estado.tablas.usuarios.pagina = 1;
            const cont = $('#tablaUsuarios');
            if (cont) cont.innerHTML = tablaUsuarios();
        }

        let temporizador = null;
        content.addEventListener('input', (e) => {
            if (e.target.id !== 'buscarUsuario') return;
            clearTimeout(temporizador);
            temporizador = setTimeout(() => { estado.busqueda = e.target.value.trim(); refrescarTabla(); }, 150);
        });

        content.addEventListener('change', (e) => {
            if (e.target.id === 'filtroEstado') {
                estado.filtroEstado = e.target.value;
                refrescarTabla();
            }
        });

        content.addEventListener('click', async (e) => {
            if (e.target.closest('[data-reintentar]')) { render(); return; }

            const ap = e.target.closest('[data-aprobar]');
            if (ap) { aprobarComo(ap.dataset.aprobar, ap.dataset.rol, ap); return; }

            const re = e.target.closest('[data-rechazar]');
            if (re) { rechazar(re.dataset.rechazar); return; }

            const ec = e.target.closest('[data-editar-cuota]');
            if (ec) { editarCuota(ec.dataset.editarCuota); return; }

            const ed = e.target.closest('[data-editar-politica]');
            if (ed) { editarPolitica(ed.dataset.editarPolitica); return; }

            if (e.target.closest('#btnActualizar')) { render(); UI.toast('Datos actualizados.'); return; }

            if (e.target.closest('#btnRestaurarPol')) {
                const okConfirm = await UI.confirmar({
                    titulo: '¿Restaurar las políticas originales?',
                    mensaje: 'Se pierden los cambios hechos a la política general y a los roles. Las excepciones por usuario no se modifican.',
                    textoOk: 'Restaurar',
                    peligro: true,
                });
                if (okConfirm) { const r = await Api.restaurarPoliticas(); if (r.ok) { render(); UI.toast('Políticas restauradas.', { tipo: 'ok' }); } }
                return;
            }

            const k = e.target.closest('[data-menu-usuario]');
            if (k) {
                const u = Auth.obtenerUsuario(k.dataset.menuUsuario);
                if (!u) return;
                const items = [];
                if (u.rol !== 'admin') items.push({ texto: 'Cambiar rol', icono: iconos.escudo, accion: () => cambiarRol(u.id) });
                items.push({ texto: 'Excepciones de política', icono: iconos.politicas, accion: () => editarExcepciones(u.id) });
                if (u.rol !== 'admin') {
                    items.push({ separador: true });
                    if (u.estado !== 'aprobado') items.push({ texto: 'Aprobar cuenta', icono: iconos.check, accion: () => aprobar(u.id) });
                    if (u.estado === 'aprobado') items.push({ texto: 'Suspender cuenta', icono: iconos.cerrar, peligro: true, accion: () => rechazar(u.id, true) });
                    else if (u.estado === 'pendiente') items.push({ texto: 'Rechazar cuenta', icono: iconos.cerrar, peligro: true, accion: () => rechazar(u.id) });
                }
                UI.menuContextual(k, items);
            }
        });

        Drive.asegurar(admin);
        render();
    </script>

</body>

</html>
