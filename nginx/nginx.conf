server {
    listen 80;
    server_name _;

    client_max_body_size 100M;  # permitir subir archivos grandes

    # Sirve el frontend estático (HTML/CSS/JS)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ =404;
    }

    # Todo lo que empiece con /api/ se redirige al backend (FastAPI)
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Documentación automática de la API (Swagger), útil para el equipo
    location /api/docs {
        proxy_pass http://backend:8000/docs;
    }
}
