<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveClon — Inicio</title>

<!-- Bootstrap 5 (solo utilidades de grid/layout, la identidad visual es propia) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR / "GABINETE" -->
  <aside class="cabinet">
    <div class="brand">
      <span class="brand-mark"></span>
      DriveClon
    </div>

    <div class="new-wrap">
      <button class="btn-new" type="button" id="btnNuevo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nuevo
      </button>
      <div class="new-menu" id="newMenu">
        <button type="button" class="new-menu-item" id="opCarpeta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg>
          Carpeta nueva
        </button>
        <button type="button" class="new-menu-item" id="opArchivo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8Z"/><path d="M14 2v6h6"/></svg>
          Subir archivo
        </button>
      </div>
      <input type="file" id="fileInput" style="display:none">
    </div>

    <nav class="nav-group">
      <a href="#" class="nav-link active" data-section="inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Inicio
      </a>
      <a href="#" class="nav-link" data-section="archivos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg>
        Mis archivos
      </a>
      <a href="#" class="nav-link" data-section="compartidos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="12" r="2.4"/><circle cx="17" cy="6" r="2.4"/><circle cx="17" cy="18" r="2.4"/><path d="m9 10.8 6-3.6M9 13.2l6 3.6"/></svg>
        Compartidos conmigo
      </a>
      <a href="#" class="nav-link" data-section="papelera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12"/></svg>
        Papelera
      </a>
    </nav>

    <div class="cabinet-footer">
      <div class="storage-box">
        <div class="storage-label">
          <span>Almacenamiento</span>
          <span id="storagePct">—</span>
        </div>
        <div class="storage-track">
          <div class="storage-fill" id="storageFill"></div>
        </div>
        <div class="storage-detail" id="storageDetail">Calculando uso…</div>
      </div>
    </div>
  </aside>

  <!-- CONTENIDO -->
  <main class="main">
    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Buscar en DriveClon">
      </div>
      <div class="avatar">LA</div>
    </header>

    <div class="content">

      <section id="sectionFolders">
        <div class="section-head">
          <h2>Carpetas recientes</h2>
          <a href="#" class="see-all">Ver todas</a>
        </div>
        <div class="folder-grid" id="folderGrid"></div>
      </section>

      <section id="sectionFiles">
        <div class="section-head">
          <h2 id="filesTitle">Archivos</h2>
          <a href="#" class="see-all">Ver todos</a>
        </div>
        <table class="file-table" id="fileTable">
          <thead>
            <tr>
              <th>Nombre</th>
              <th class="col-size">Tamaño</th>
              <th class="col-date">Modificado</th>
            </tr>
          </thead>
          <tbody id="fileTableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg>
          <p id="emptyStateText">No hay nada para mostrar acá todavía.</p>
        </div>
      </section>

    </div>
  </main>

</div>

<script>
  // ---- Datos simulados (en la versión final vendrán de la API vía Fetch + JWT) ----
  const CUPO_TOTAL_GB = 15;

  const carpetas = [
    { nombre: "Proyecto Facultad", items: 12 },
    { nombre: "Facturas 2026", items: 34 },
    { nombre: "Diseño Web", items: 8 },
    { nombre: "Backups", items: 5 },
  ];

  const archivos = [
    { nombre: "propuesta-tp-final.docx", tipo: "doc", tamanioMB: 1.4, fecha: "12 sep 2026" },
    { nombre: "logo-drive-clon.svg",      tipo: "img", tamanioMB: 0.2, fecha: "10 sep 2026" },
    { nombre: "Diseño Web",               tipo: "folder", tamanioMB: 0, fecha: "9 sep 2026" },
    { nombre: "backend-endpoints.pdf",    tipo: "doc", tamanioMB: 3.1, fecha: "6 sep 2026" },
    { nombre: "capturas-testing.zip",     tipo: "doc", tamanioMB: 240, fecha: "3 sep 2026" },
  ];

  const iconFolder = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg>`;
  const iconFile   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a1 1 0 0 0-1 1v18a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8Z"/><path d="M14 2v6h6"/></svg>`;

  function renderCarpetas(){
    const grid = document.getElementById('folderGrid');
    grid.innerHTML = carpetas.map(c => `
      <div class="folder-card">
        <span class="icon">${iconFolder}</span>
        <div class="meta">
          <strong>${c.nombre}</strong>
          <span>${c.items} elementos</span>
        </div>
      </div>
    `).join('');
  }

  function formatoTamanio(mb){
    if (mb === 0) return "—";
    if (mb < 1) return Math.round(mb * 1000) + " KB";
    if (mb >= 1000) return (mb / 1000).toFixed(1) + " GB";
    return mb.toFixed(1) + " MB";
  }

  function renderArchivos(){
    const body = document.getElementById('fileTableBody');
    body.innerHTML = archivos.map(a => `
      <tr>
        <td>
          <div class="file-name ${a.tipo === 'folder' ? 'folder-row' : ''}">
            ${a.tipo === 'folder' ? iconFolder : iconFile}
            ${a.nombre}
          </div>
        </td>
        <td class="col-size">${formatoTamanio(a.tamanioMB)}</td>
        <td class="col-date">${a.fecha}</td>
      </tr>
    `).join('');
  }

  // ---- Barra dinámica de almacenamiento ----
  // Suma el tamaño real de los archivos (simulados) y lo dibuja como % del cupo total.
  function renderAlmacenamiento(){
    const usadoMB = archivos.reduce((acc, a) => acc + a.tamanioMB, 0);
    const usadoGB = usadoMB / 1000;
    const totalGB = CUPO_TOTAL_GB;
    const porcentaje = Math.min(100, (usadoGB / totalGB) * 100);

    const fill = document.getElementById('storageFill');
    const pct = document.getElementById('storagePct');
    const detail = document.getElementById('storageDetail');

    requestAnimationFrame(() => { fill.style.width = porcentaje.toFixed(1) + "%"; });
    pct.textContent = porcentaje.toFixed(0) + "%";
    detail.innerHTML = `<strong>${usadoGB.toFixed(2)} GB</strong> de ${totalGB} GB`;
  }

  // ---- Contenido por sección del menú lateral ----
  // "Mis archivos" muestra todos los archivos; "Compartidos conmigo" y
  // "Papelera" están vacíos por ahora (no hay backend todavía que
  // maneje comparticiones ni borrados reales).
  const seccionesInfo = {
    inicio:      { titulo: "Archivos",  folders: true,  emptyText: null },
    archivos:    { titulo: "Mis archivos", folders: false, emptyText: null },
    compartidos: { titulo: "Compartidos conmigo", folders: false, emptyText: "Todavía no tenés archivos compartidos por otras personas." },
    papelera:    { titulo: "Papelera", folders: false, emptyText: "La papelera está vacía." },
  };

  let seccionActual = 'inicio';

  function renderSeccion(){
    const info = seccionesInfo[seccionActual];
    document.getElementById('sectionFolders').style.display = info.folders ? '' : 'none';
    document.getElementById('filesTitle').textContent = info.titulo;

    const table = document.getElementById('fileTable');
    const empty = document.getElementById('emptyState');
    const emptyText = document.getElementById('emptyStateText');

    if (info.emptyText){
      table.style.display = 'none';
      empty.style.display = 'flex';
      emptyText.textContent = info.emptyText;
    } else {
      table.style.display = '';
      empty.style.display = 'none';
      renderArchivos();
    }
  }

  // ---- Navegación del sidebar ----
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      seccionActual = link.dataset.section;
      renderSeccion();
    });
  });

  // ---- Menú "Nuevo" ----
  const btnNuevo = document.getElementById('btnNuevo');
  const newMenu = document.getElementById('newMenu');

  btnNuevo.addEventListener('click', (e) => {
    e.stopPropagation();
    newMenu.classList.toggle('open');
  });
  document.addEventListener('click', () => newMenu.classList.remove('open'));
  newMenu.addEventListener('click', (e) => e.stopPropagation());

  // Carpeta nueva: pide un nombre y la agrega a la grilla
  document.getElementById('opCarpeta').addEventListener('click', () => {
    newMenu.classList.remove('open');
    const nombre = prompt('Nombre de la nueva carpeta:');
    if (!nombre || !nombre.trim()) return;
    carpetas.unshift({ nombre: nombre.trim(), items: 0 });
    renderCarpetas();
    if (seccionActual !== 'inicio'){
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      document.querySelector('.nav-link[data-section="inicio"]').classList.add('active');
      seccionActual = 'inicio';
      renderSeccion();
    }
  });

  // Subir archivo: abre el selector nativo del navegador y agrega el
  // archivo elegido a la tabla + recalcula el almacenamiento usado.
  const fileInput = document.getElementById('fileInput');
  document.getElementById('opArchivo').addEventListener('click', () => {
    newMenu.classList.remove('open');
    fileInput.click();
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    archivos.unshift({
      nombre: file.name,
      tipo: 'doc',
      tamanioMB: file.size / (1024 * 1024),
      fecha: new Date().toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' }),
    });
    if (seccionActual === 'inicio' || seccionActual === 'archivos'){
      renderArchivos();
    }
    renderAlmacenamiento();
    fileInput.value = '';
  });

  renderCarpetas();
  renderArchivos();
  renderAlmacenamiento();
</script>

</body>
</html>
